<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beranda - Python Blockly Simulator</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 4rem 1rem 2rem 1rem;
            box-sizing: border-box;
            overflow-x: hidden;
            overflow-y: auto;
            text-align: center;
        }
        .home-container {
            z-index: 10;
            padding: 2rem;
            max-width: 800px;
            margin: auto 0;
        }
        .home-title {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }
        .home-subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 3rem;
        }
        .menu-cards {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 3rem 2rem;
            width: 300px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(10px);
        }
        .card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.2);
        }
        .card-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }
        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .card-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
        }
        
        @media (max-width: 768px) {
            .home-title {
                font-size: 2.2rem;
            }
            .home-subtitle {
                font-size: 1rem;
                margin-bottom: 2rem;
            }
            .menu-cards {
                flex-direction: column;
                gap: 1rem;
                align-items: center;
            }
            .card {
                width: 100%;
                max-width: 350px;
                padding: 2rem 1.5rem;
            }
            body {
                padding: 2rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="home-container">
        <h1 class="home-title">Python Blockly Simulator</h1>
        <p class="home-subtitle">Belajar pemrograman Python menjadi lebih mudah dan interaktif dengan blok visual.</p>
        
        <div class="menu-cards">
            <a href="materi.html" class="card">
                <div class="card-icon">📚</div>
                <div class="card-title">Materi Belajar</div>
                <div class="card-desc">Pelajari konsep dasar pemrograman Python sebelum memulai praktik.</div>
            </a>
            
            <a href="simulator.html" class="card">
                <div class="card-icon">🎮</div>
                <div class="card-title">Simulasi Latihan</div>
                <div class="card-desc">Uji pemahamanmu dengan menyelesaikan tantangan coding interaktif.</div>
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const particlesContainer = document.getElementById('particles');
            if(particlesContainer) {
                for (let i = 0; i < 50; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = Math.random() * 100 + 'vw';
                    particle.style.top = Math.random() * 100 + 'vh';
                    particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                    particle.style.animationDelay = (Math.random() * 5) + 's';
                    particlesContainer.appendChild(particle);
                }
            }
        });
    </script>
</body>
</html>
