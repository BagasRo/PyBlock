<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Blockly Simulator - NPM Version</title>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">


    <!-- Library Inti Blockly (blocking) -->
    <script src="/blockly/blockly_compressed.js"></script>
    <script src="/blockly/blocks_compressed.js"></script>
    <script src="/blockly/python_compressed.js"></script>
    
    <!-- Pyodide (Local) -->
    <script src="/pyodide/pyodide.js"></script>

    <!-- File Bahasa (blocking) -->
    <script src="/blockly/msg/en.js"></script>
    
    <!-- Modul Aplikasi (deferred) -->
    <script src="/js/blockly-config.js" defer></script>
    <script src="/js/python-generator.js" defer></script>
    <script src="/js/simulator.js?v=5.0" defer></script>
    <script src="/js/main.js" defer></script>
</head>
<body>
    <!-- Particles Background -->
    <div class="particles" id="particles"></div>
    
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">🐍</div>
            <div class="logo-text">
                <span>Blockly Python Simulator</span>
                <small class="version">v1.0.0</small>
            </div>
        </div>
        <div class="controls">
            <button class="btn btn-secondary" id="btnClear" title="Bersihkan Workspace">
                <span>🗑️</span> <span class="btn-text">Bersihkan</span>
            </button>
            <button class="btn btn-secondary" id="btnSave" title="Simpan Proyek">
                <span>💾</span> <span class="btn-text">Simpan</span>
            </button>
            <button class="btn btn-secondary" id="btnLoadTrigger" title="Muat Proyek">
                <span>📂</span> <span class="btn-text">Muat</span>
            </button>
            <input type="file" id="btnLoad" accept=".json" style="display: none;">
            <button class="btn btn-danger" id="btnRun" title="Jalankan Simulasi">
                <span>▶️</span> <span class="btn-text">Jalankan</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Blockly Panel -->
        <div class="panel blockly-panel">
            <div class="panel-header">
                <span>🧩</span> Blockly Workspace
                <div class="workspace-controls">
                    <button class="icon-btn" id="btnZoomIn" title="Zoom In">+</button>
                    <button class="icon-btn" id="btnZoomOut" title="Zoom Out">−</button>
                    <button class="icon-btn" id="btnZoomReset" title="Reset Zoom">⟲</button>
                </div>
            </div>
            <div class="panel-content">
                <div id="blocklyDiv"></div>
            </div>
        </div>
        
        <!-- Code & Output Panel -->
        <div class="panel code-panel">
            <div class="panel-header">
                <span>🐍</span> Kode Python
                <span class="code-status" id="codeStatus">Ready</span>
            </div>
            <div class="code-area" id="codeArea">
                <div class="line-numbers" id="lineNumbers">1</div>
                <pre class="code-content" id="codeContent"><code class="python"><span class="comment"># Kode Python akan muncul di sini...</span></code></pre>
            </div>
            
            <!-- Output Console -->
            <div class="output-panel">
                <div class="output-header">
                    <div class="output-title">
                        <span>📤</span> Output / Console
                    </div>
                    <div class="output-controls">
                        <button class="btn btn-secondary btn-small" id="btnClearOutput" title="Clear Console">Clear</button>
                        <button class="btn btn-secondary btn-small" id="btnExport" title="Export Python">📥 Export</button>
                    </div>
                </div>
                <div class="output-content" id="outputContent">
                    <div class="output-line info">
                        <span class="timestamp">[System]</span> 
                        🚀 Python Blockly Simulator v1.0.0 siap!
                        <br><span class="hint">💡 Tips: Drag & drop block dari toolbox untuk memulai</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Export Modal -->
    <div class="modal" id="exportModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📥 Export Kode Python</h2>
                <button class="close-btn" id="closeExportModal">&times;</button>
            </div>
            <div class="export-content">
                <textarea id="exportCode" readonly></textarea>
                <div class="export-actions">
                    <button class="btn btn-primary" id="btnCopyCode">📋 Copy</button>
                    <button class="btn btn-secondary" id="btnDownloadCode">💾 Download .py</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Loading Blockly...</p>
    </div>

</body>
</html>
